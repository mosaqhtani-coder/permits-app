<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نظام تصاريح العمل</title>
  <meta name="theme-color" content="#0B2E1E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="التصاريح">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root { --brand-900: #0B2E1E; --primary: #0F7A41; --signal: #F5B700; --bg: #EEF1F0; --text: #121A1F; --muted: #4B5960; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--brand-900); overscroll-behavior: none; }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
           padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); color: var(--text); }
    [hidden] { display: none !important; }

    #frame { flex: 1; width: 100%; border: 0; background: var(--bg); min-height: 0; }

    /* شريط التثبيت / التشخيص أعلى الشاشة */
    .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #fff; color: var(--text);
           border-bottom: 3px solid var(--signal); font-size: 14px; line-height: 1.5; }
    .bar span { flex: 1; }
    .bar button { min-height: 38px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--primary); background: var(--primary);
                  color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .bar button.ghost { background: transparent; color: var(--muted); border-color: #C9D1D3; }
    .bar.warn { background: #FFF3CC; }

    /* شاشات تغطي كامل الشاشة: تحميل / ما فيه اتصال / إعداد */
    .screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 14px; padding: 24px; text-align: center; background: var(--brand-900); color: #fff; }
    .screen h1 { margin: 0; font-size: 22px; }
    .screen p { margin: 0; max-width: 360px; color: #CDE8D8; line-height: 1.7; font-size: 15px; }
    .screen .logo { width: 84px; height: 84px; border-radius: 22px; }
    .spin { width: 34px; height: 34px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: var(--signal); animation: sp 0.9s linear infinite; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .screen button { min-height: 50px; padding: 10px 26px; border-radius: 14px; border: 0; background: var(--signal); color: #1B1500;
                     font-size: 17px; font-weight: 800; cursor: pointer; font-family: inherit; }
    .screen input { width: 100%; max-width: 380px; min-height: 52px; padding: 10px 12px; border-radius: 12px; border: 2px solid #3E6150;
                    background: #fff; color: var(--text); font-size: 15px; direction: ltr; text-align: left; font-family: inherit; }
    .screen .err { color: #FFB4AB; min-height: 22px; font-size: 14px; }
    #loading { background: rgba(11, 46, 30, .96); }
  </style>
</head>
<body>
  <div class="bar" id="bar" hidden>
    <span id="barText"></span>
    <button type="button" id="barAct" hidden>تثبيت</button>
    <button type="button" class="ghost" id="barClose">إخفاء</button>
  </div>

  <iframe id="frame" title="نظام تصاريح العمل" allow="camera; microphone; geolocation; fullscreen; clipboard-write" hidden></iframe>

  <div class="screen" id="loading" hidden>
    <img class="logo" src="icons/icon-192.png" alt="">
    <div class="spin" aria-hidden="true"></div>
    <p id="loadingTxt">جاري فتح النظام...</p>
  </div>

  <div class="screen" id="offline" hidden>
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>ما فيه اتصال</h1>
    <p>تأكد من الإنترنت وحاول مرة ثانية. النظام يحتاج اتصال عشان يسجّل العمليات.</p>
    <button type="button" id="retry">إعادة المحاولة</button>
  </div>

  <div class="screen" id="setup" hidden>
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1>أول مرة؟</h1>
    <p>الصق رابط نظام التصاريح (المنتهي بـ <b dir="ltr">/exec</b>) مرة وحدة، ويتحفظ بالجهاز.</p>
    <input id="setupUrl" type="url" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="err" id="setupErr"></div>
    <button type="button" id="setupGo">حفظ وفتح</button>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    'use strict';
    var URL_RE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
    var $ = function (id) { return document.getElementById(id); };

    // تخزين آمن (لو الجهاز حاجب التخزين ما نكسر شي)
    var LS = {
      get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
      set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
    };

    function clean(u) {
      u = String(u || '').trim().replace(/[?#].*$/, '');
      return URL_RE.test(u) ? u : '';
    }

    var cfg = window.PTW_CONFIG || {};
    var appUrl = clean(cfg.APP_URL) || clean(LS.get('ptw_app_url'));
    var frame = $('frame'), loading = $('loading'), offline = $('offline'), setup = $('setup'), bar = $('bar');
    var helloSeen = false, loadTimer = null, helloTimer = null, current = '';

    function show(el, on) { el.hidden = !on; }

    // ------------ بناء رابط الإطار ------------
    function frameUrl(u) {
      var x = new URL(u);
      x.searchParams.set('embed', '1');
      // التوكن يمر بالرابط فقط لو الجهاز حاجب تخزين الإطار (قراره من إشارة hello)
      var tk = LS.get('ptw_tk');
      if (tk && LS.get('ptw_ls_bad') === '1') x.searchParams.set('tk', tk);
      return x.toString();
    }

    // نقبل بس روابط من نفس تطبيق الويب (نفس المسار تماماً)
    function allowed(u) {
      if (!appUrl || typeof u !== 'string') return false;
      if (u.indexOf(appUrl) !== 0) return false;
      var nx = u.charAt(appUrl.length);
      return nx === '' || nx === '?' || nx === '#';
    }

    function trusted(origin) {
      if (!appUrl) return false;
      try {
        var o = new URL(origin);
        return o.protocol === 'https:' && (/\.googleusercontent\.com$/.test(o.hostname) || origin === new URL(appUrl).origin);
      } catch (e) { return false; }
    }

    // ------------ تحميل صفحة داخل الإطار ------------
    function go(u) {
      current = u;
      helloSeen = false;
      show(frame, true);
      show(loading, true);
      clearTimeout(loadTimer); clearTimeout(helloTimer);
      loadTimer = setTimeout(function () {
        $('loadingTxt').textContent = 'التحميل أخذ وقت أطول من المعتاد... تأكد من الاتصال.';
      }, 15000);
      frame.src = frameUrl(u);
    }

    function loaded() {
      clearTimeout(loadTimer);
      show(loading, false);
      $('loadingTxt').textContent = 'جاري فتح النظام...';
    }

    frame.addEventListener('load', function () {
      if (!frame.src || frame.src === 'about:blank') return;
      // الصفحة وصلت. لو ما جت إشارة hello خلال 8 ثواني، غالباً النسخة المنشورة قديمة (ما فيها وضع التطبيق)
      setTimeout(loaded, 600);
      clearTimeout(helloTimer);
      helloTimer = setTimeout(function () {
        if (helloSeen) return;
        showBar('warn', 'النظام ما رد بإشارة التطبيق. غالباً نسخة تطبيق الويب المنشورة قديمة: انشر نسخة جديدة (v2.37) من Apps Script.', null);
      }, 8000);
    });

    // ------------ رسائل من جسر Apps Script داخل الإطار ------------
    window.addEventListener('message', function (ev) {
      if (!trusted(ev.origin)) return;
      var d = ev.data;
      if (!d || typeof d !== 'object' || typeof d.ptw !== 'string') return;
      if (d.ptw === 'hello') {
        helloSeen = true;
        loaded();
        if (d.ls === false) LS.set('ptw_ls_bad', '1');
        if (bar.dataset.kind === 'warn') show(bar, false);
      } else if (d.ptw === 'tok') {
        if (typeof d.t === 'string' && d.t.length < 2000) { if (d.t) LS.set('ptw_tk', d.t); else LS.del('ptw_tk'); }
      } else if (d.ptw === 'nav') {
        if (allowed(d.url)) go(d.url);
      }
    });

    // ------------ شريط (تثبيت / تحذير) ------------
    var onInstall = null;
    function showBar(kind, text, actLabel, actFn) {
      bar.dataset.kind = kind;
      bar.className = 'bar' + (kind === 'warn' ? ' warn' : '');
      $('barText').textContent = text;
      var act = $('barAct');
      act.hidden = !actLabel;
      if (actLabel) { act.textContent = actLabel; onInstall = actFn || null; }
      show(bar, true);
    }
    $('barAct').addEventListener('click', function () { if (onInstall) onInstall(); });
    $('barClose').addEventListener('click', function () {
      if (bar.dataset.kind === 'install') LS.set('ptw_inst_dis', '1');
      show(bar, false);
    });

    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var deferred = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      if (!standalone && LS.get('ptw_inst_dis') !== '1') {
        showBar('install', 'ثبّت التطبيق على جوالك عشان يفتح بضغطة من الشاشة الرئيسية.', 'تثبيت', function () {
          if (!deferred) return;
          deferred.prompt();
          deferred.userChoice.finally(function () { deferred = null; show(bar, false); });
        });
      }
    });
    window.addEventListener('appinstalled', function () { show(bar, false); });
    if (isIOS && !standalone && LS.get('ptw_inst_dis') !== '1') {
      showBar('install', 'للتثبيت على الآيفون: اضغط زر المشاركة (المربع والسهم) ثم «إضافة إلى الشاشة الرئيسية».', null);
    }

    // ------------ الاتصال ------------
    function online() { return navigator.onLine !== false; }
    function refreshOnline() {
      if (!appUrl) return;
      if (!online()) { show(offline, true); }
      else if (!offline.hidden) { show(offline, false); go(current || appUrl); }
    }
    window.addEventListener('online', refreshOnline);
    window.addEventListener('offline', function () { if (appUrl) show(offline, true); });
    $('retry').addEventListener('click', function () {
      if (!online()) return;
      show(offline, false);
      go(current || appUrl);
    });

    // ------------ الإعداد (لو الرابط ما انحط بـconfig.js) ------------
    $('setupGo').addEventListener('click', function () {
      var u = clean($('setupUrl').value);
      if (!u) { $('setupErr').textContent = 'الرابط غير صحيح. لازم يبدأ بـ https://script.google.com/macros/s/ وينتهي بـ /exec'; return; }
      LS.set('ptw_app_url', u);
      appUrl = u;
      show(setup, false);
      start();
    });

    function start() {
      if (!appUrl) { show(setup, true); return; }
      if (!online()) { show(offline, true); show(frame, false); return; }
      go(appUrl);
    }

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
    start();
  })();
  </script>
</body>
</html>
